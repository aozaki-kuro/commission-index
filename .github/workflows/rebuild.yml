name: Rebuild Web

on:
  repository_dispatch:
    types: [admin-data-changed]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  rebuild:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # 与 ci.yml 的 Web 发布共享锁；获得锁之后才读取最新数据。
    concurrency:
      group: release-web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Shared with ci.yml's web job. This workflow has no upstream build job, so it validates the
      # candidate itself inside the composite (validate-code: true) before exporting.
      - uses: ./.github/actions/deploy-web-snapshot
        with:
          validate-code: true
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
