name: CI / Deploy

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# PR 校验可以取消；部署由下方共享环境锁保护。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Validate & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # PR 不读取生产数据、不接收生产凭证；测试先验证无 generated 的干净检出。
      - name: Lint
        run: pnpm run lint
      - name: Typecheck all workspaces
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      # Admin UI 测试全部拦截 /api/admin/**，不需要生产数据或凭证；CI 下 Playwright 总是自启 Vite。
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Admin UI tests (API fixtures)
        run: pnpm run test:admin-ui
      # pnpm 不会把 workspace 包链接到根 node_modules，必须在声明了 domain 依赖的包内执行。
      # 写入与视觉测试相同的 fixture；check 通过同一个 FACT_SOURCE_DIR 读取，不碰 apps/web/generated。
      - name: Prepare offline Astro fixture
        working-directory: apps/admin-worker
        env:
          FACT_SOURCE_DIR: generated-fixture
        run: node --import tsx scripts/writeOfflineFactSource.ts
      - name: Astro check with offline fixture
        env:
          FACT_SOURCE_DIR: generated-fixture
        run: pnpm -C apps/web run check:astro
      - name: Build admin
        run: pnpm run build:admin

  web:
    name: Web — Snapshot & Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: release-web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The shared snapshot/validate/deploy sequence lives in the composite action; it runs inside
      # this job so the `release-web-production` lock above spans the whole export->deploy window.
      # `build` already ran lint/typecheck/test, so validation is not repeated here.
      - uses: ./.github/actions/deploy-web-snapshot
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  admin:
    name: Admin — Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: release-admin-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Deploy current admin candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "部署跳过：候选 ${GITHUB_SHA} 已过期，master=${current_sha}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pnpm run deploy:admin
