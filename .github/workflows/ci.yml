name: CI / Deploy

on:
  pull_request:
  push:
    branches: [master]

# On PRs: cancel outdated runs freely.
# On master: never cancel — we don't want a deploy killed mid-flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # BUILD — runs on every PR and every push to master
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        id: setup

      - name: Restore turbo cache
        id: turbo_cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build
        run: pnpm run build:admin

      - name: Save turbo cache
        if: always() && steps.turbo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}

  # ────────────────────────────────────────────────────────────────────────────
  # WEB — master only, runs after build
  # ────────────────────────────────────────────────────────────────────────────
  web:
    name: Web — Export, Check & Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        id: setup

      - name: Restore turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Restore generated web inputs
        id: generated_cache
        uses: actions/cache/restore@v6
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-master-${{ hashFiles('apps/web/wrangler.jsonc', 'apps/admin-worker/scripts/exportWebFactSource.ts', 'packages/domain/src/factSource.ts') }}
          restore-keys: |
            generated-${{ runner.os }}-master-
            generated-${{ runner.os }}-

      - name: Export fact source from D1/R2
        run: pnpm run web:fact-source:export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Astro check
        run: pnpm -C apps/web check:astro

      - name: Build web
        run: pnpm run build:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy web
        run: pnpm run deploy:web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Save generated web inputs
        if: success() && steps.generated_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: apps/web/generated
          key: generated-${{ runner.os }}-master-${{ hashFiles('apps/web/wrangler.jsonc', 'apps/admin-worker/scripts/exportWebFactSource.ts', 'packages/domain/src/factSource.ts') }}

  # ────────────────────────────────────────────────────────────────────────────
  # ADMIN — master only, runs after build (in parallel with web)
  # ────────────────────────────────────────────────────────────────────────────
  admin:
    name: Admin — Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        id: setup

      - name: Restore turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Deploy admin
        run: pnpm run deploy:admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
