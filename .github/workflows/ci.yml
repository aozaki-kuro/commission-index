name: CI / Deploy

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# PR 校验可以取消；部署由下方共享环境锁保护。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Validate & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # PR 不读取生产数据、不接收生产凭证；测试先验证无 generated 的干净检出。
      - name: Lint
        run: pnpm run lint
      - name: Typecheck all workspaces
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm run test
      # Admin UI 测试全部拦截 /api/admin/**，不需要生产数据或凭证；CI 下 Playwright 总是自启 Vite。
      # 只在 PR 上跑：master push 的合并组合由 lint/typecheck/单测覆盖，省下约 80s 发布等待。
      - name: Install Playwright Chromium
        if: github.event_name == 'pull_request'
        # --with-deps pulls font packages through apt. When the runner cannot reach the Ubuntu mirrors, install the
        # browser alone: the image already carries Chromium's shared libraries and the admin specs use bundled web fonts.
        run: pnpm exec playwright install --with-deps chromium || pnpm exec playwright install chromium
      - name: Admin UI tests (API fixtures)
        if: github.event_name == 'pull_request'
        run: pnpm run test:admin-ui
      # pnpm 不会把 workspace 包链接到根 node_modules，必须在声明了 domain 依赖的包内执行。
      # 写入与视觉测试相同的 fixture；check 通过同一个 FACT_SOURCE_DIR 读取，不碰 apps/web/generated。
      - name: Prepare offline Astro fixture
        working-directory: apps/admin-worker
        env:
          FACT_SOURCE_DIR: generated-fixture
        run: node --import tsx scripts/writeOfflineFactSource.ts
      - name: Astro check with offline fixture
        env:
          FACT_SOURCE_DIR: generated-fixture
        run: pnpm -C apps/web run check:astro
      # PR 上构建 web：同一 fixture 改为附带确定性的占位图（写入干净检出里不存在的 apps/web/generated/source-images，
      # registry 只从那里 glob），无凭证、无远端访问。master 的真实构建在 web 发布 job 中进行。
      - name: Prepare fixture placeholder images
        if: github.event_name == 'pull_request'
        working-directory: apps/admin-worker
        env:
          FACT_SOURCE_DIR: generated-fixture
          FACT_SOURCE_PLACEHOLDER_IMAGES: '1'
        run: node --import tsx scripts/writeOfflineFactSource.ts
      - name: Build web with offline fixture
        if: github.event_name == 'pull_request'
        env:
          FACT_SOURCE_DIR: generated-fixture
        run: pnpm -C apps/web run build
      # The repo is public and GitHub resolves a commit SHA to it, so the site must never carry one.
      - name: Check web output for commit SHAs
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for sha in "$(git rev-parse HEAD)" "$PR_HEAD_SHA"; do
            [ -n "$sha" ] || continue
            if grep -rlF "$sha" apps/web/dist; then
              echo "::error::apps/web/dist contains commit SHA ${sha} (files listed above)."
              exit 1
            fi
          done
      # Hidden commissions must leave no trace in the static output: neither their image nor their public ID.
      - name: Check web output for hidden commissions
        if: github.event_name == 'pull_request'
        run: |
          content=apps/web/generated-fixture/fact-source/content.json
          hidden="$(jq -r '[.. | objects | select(has("fileName") and .Hidden == true)] | .[] | "\(.fileName) \(.publicId)"' "$content")"
          visible="$(jq -r '[.. | objects | select(has("fileName") and .Hidden != true)] | .[0].fileName' "$content")"
          # Guard against a vacuous pass: the fixture must hold a hidden commission, and visible images must be emitted.
          [ -n "$hidden" ] || { echo "::error::The fixture has no hidden commission to check."; exit 1; }
          compgen -G "apps/web/dist/_astro/${visible}.*" > /dev/null || { echo "::error::No built image for visible commission ${visible}."; exit 1; }
          while read -r file_name public_id; do
            if compgen -G "apps/web/dist/_astro/${file_name}.*" > /dev/null; then
              echo "::error::apps/web/dist/_astro contains an image of hidden commission ${file_name}."
              exit 1
            fi
            if grep -rlF "$public_id" apps/web/dist; then
              echo "::error::apps/web/dist mentions hidden commission ${public_id} (files listed above)."
              exit 1
            fi
          done <<< "$hidden"
      - name: Build admin
        run: pnpm run build:admin

  web:
    name: Web — Snapshot & Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # A cold image cache downloads every source image; the bound keeps a hung step from holding the lock for 6 h.
    timeout-minutes: 30
    concurrency:
      group: release-web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The shared snapshot/validate/deploy sequence lives in the composite action; it runs inside
      # this job so the `release-web-production` lock above spans the whole export->deploy window.
      # `build` already ran lint/typecheck/test, so validation is not repeated here.
      - uses: ./.github/actions/deploy-web-snapshot
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  admin:
    name: Admin — Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    timeout-minutes: 10
    concurrency:
      group: release-admin-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Deploy current admin candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "部署跳过（未部署任何内容）：候选 ${GITHUB_SHA} 已被 master ${current_sha} 取代" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Admin deploy skipped::Candidate ${GITHUB_SHA} was superseded by master ${current_sha}; nothing was deployed."
            exit 0
          fi
          pnpm run deploy:admin
