name: Deploy web snapshot
description: >-
  Reject stale code candidates, export one read-only fact-source snapshot, type-check against it,
  then build and deploy that frozen snapshot. Invoked as a step inside the caller's release job so
  the job-level `release-web-production` concurrency lock spans the whole export->deploy sequence.

inputs:
  # Rebuild has no upstream build job, so it must lint/typecheck/test itself before exporting.
  # ci.yml's web job already did this in its `build` dependency, so it leaves this false.
  validate-code:
    description: Run lint/typecheck/test before exporting.
    required: false
    default: 'false'
  # Composite actions have no `secrets` context; callers must pass secrets explicitly as inputs.
  cloudflare-api-token:
    description: CLOUDFLARE_API_TOKEN, passed as an input from the caller's secrets.
    required: true
  cloudflare-account-id:
    description: CLOUDFLARE_ACCOUNT_ID, passed as an input from the caller's secrets.
    required: true

runs:
  using: composite
  steps:
    - name: Reject outdated code candidate
      id: candidate
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')
        if [ "$current_sha" != "$GITHUB_SHA" ]; then
          echo "部署跳过（未部署任何内容）：候选 ${GITHUB_SHA} 已被 master ${current_sha} 取代" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Web deploy skipped::Candidate ${GITHUB_SHA} was superseded by master ${current_sha}; nothing was deployed."
          echo 'current=false' >> "$GITHUB_OUTPUT"
        else
          echo 'current=true' >> "$GITHUB_OUTPUT"
        fi
    # Fail-safe: any doubt (check run missing / in-progress / failed, or the API call itself failing)
    # falls through to the full validation below. ci.yml's `Validate & Build` job already linted,
    # type-checked and tested this exact SHA, so a recorded success lets a data-driven rebuild skip it.
    - name: Reuse upstream validation if available
      id: upstream-validation
      if: inputs.validate-code == 'true' && steps.candidate.outputs.current == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        skip=false
        # Capture first: `grep -q` closing the pipe early would fail the pipeline under pipefail.
        conclusions="$(gh api --paginate \
          "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
          --jq '.check_runs[] | select(.name == "Validate & Build") | .conclusion')"
        if grep -qx success <<< "$conclusions"; then
          skip=true
        fi
        echo "skip=${skip}" >> "$GITHUB_OUTPUT"
        if [ "$skip" = "true" ]; then
          echo "跳过验证：${GITHUB_SHA} 的 \`Validate & Build\` 已成功，复用其结果" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Validate current code
      if: inputs.validate-code == 'true' && steps.candidate.outputs.current == 'true' && steps.upstream-validation.outputs.skip != 'true'
      shell: bash
      run: |
        pnpm run lint
        pnpm run typecheck
        pnpm run test
    # Restore the previously materialized source images. Never trusted blindly: the exporter re-hashes
    # every local file against the current D1 snapshot (size + sha256) and re-downloads any mismatch,
    # and drops files not retained by the new manifest, so stale bytes can never be published.
    - name: Restore cached source images
      id: restore-images
      if: steps.candidate.outputs.current == 'true'
      uses: actions/cache/restore@v6
      with:
        path: apps/web/generated/source-images
        key: web-source-images-v2-${{ github.run_id }}
        restore-keys: |
          web-source-images-v2-
    - name: Export one read-only snapshot
      if: steps.candidate.outputs.current == 'true'
      shell: bash
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: |
        pnpm run web:fact-source:export
        revision=$(node -p "require('./apps/web/generated/fact-source/content.json').meta.revision")
        echo "WEB_BUILD_CACHE_TOKEN=${revision}" >> "$GITHUB_ENV"
        echo 'FACT_SOURCE_USE_EXISTING_SNAPSHOT=1' >> "$GITHUB_ENV"
        echo "code=${GITHUB_SHA} revision=${revision}" >> "$GITHUB_STEP_SUMMARY"
    - name: Astro check against frozen snapshot
      if: steps.candidate.outputs.current == 'true'
      shell: bash
      run: pnpm -C apps/web run check:astro
    # Wrangler 的 custom build 是唯一正式构建入口；export 依赖只校验已有快照。
    - name: Build and deploy frozen snapshot
      id: deploy
      if: steps.candidate.outputs.current == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: |
        current_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')
        if [ "$current_sha" != "$GITHUB_SHA" ]; then
          echo "部署跳过（未部署任何内容）：校验期间候选 ${GITHUB_SHA} 已被 master ${current_sha} 取代" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Web deploy skipped::Candidate ${GITHUB_SHA} was superseded by master ${current_sha} during validation; nothing was deployed."
          exit 0
        fi
        pnpm run deploy:web
        echo 'deployed=true' >> "$GITHUB_OUTPUT"
        find apps/web/dist -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum >> "$GITHUB_STEP_SUMMARY"
    # The cache holds only images the public build renders: an allowlist of manifest files whose commission is
    # explicitly `Hidden: false`; every other entry is removed. It runs after deploy because the frozen-snapshot
    # check inside the build re-hashes every manifest file. A later restore re-downloads whatever is absent, so
    # cache-hit semantics for the kept images are unchanged.
    - name: Limit cached source images to visible commissions
      if: >-
        steps.candidate.outputs.current == 'true' &&
        steps.restore-images.outputs.cache-matched-key != format('web-source-images-v2-{0}', env.WEB_BUILD_CACHE_TOKEN)
      shell: bash
      run: |
        snapshot=apps/web/generated/fact-source
        images=apps/web/generated/source-images
        allowlist="${RUNNER_TEMP}/source-image-cache-allowlist.txt"
        jq -r --slurpfile content "${snapshot}/content.json" '
          [$content[0].characters[].commissions[] | select(.Hidden == false) | .id] as $visible
          | .files[] | select(.commissionId | IN($visible[])) | .relativePath
        ' "${snapshot}/source-images-manifest.json" > "$allowlist"
        find "$images" -mindepth 1 -maxdepth 1 -print0 | while IFS= read -r -d '' entry; do
          grep -qxF "source-images/${entry##*/}" "$allowlist" || rm -r -- "$entry"
        done
    # Keyed on the content revision: the restore step's key is the run id, so an exact match on
    # `web-source-images-v2-<revision>` only happens when a previous run already saved this revision.
    # In that case the identical image set is already cached and saving again would only collide
    # with the existing key, so skip it. `v2`: the cache content rule changed.
    - name: Save cached source images
      if: >-
        steps.candidate.outputs.current == 'true' &&
        steps.restore-images.outputs.cache-matched-key != format('web-source-images-v2-{0}', env.WEB_BUILD_CACHE_TOKEN)
      uses: actions/cache/save@v6
      with:
        path: apps/web/generated/source-images
        key: web-source-images-v2-${{ env.WEB_BUILD_CACHE_TOKEN }}
    # The public deployment must stay static-only (apps/web/AGENTS.md) and serve the snapshot this run built.
    # The origin is the custom-domain route in apps/web/wrangler.jsonc, the one Wrangler just deployed to.
    # Retries cover edge propagation; the total wait stays short because the release lock is held.
    - name: Smoke-check production deployment
      if: steps.deploy.outputs.deployed == 'true'
      shell: bash
      run: |
        host=$(sed -n 's/^[[:space:]]*"pattern":[[:space:]]*"\([^"]*\)".*/\1/p' apps/web/wrangler.jsonc)
        if [ -z "$host" ] || [ "$(printf '%s\n' "$host" | wc -l)" -ne 1 ]; then
          echo "::error::Expected exactly one route pattern in apps/web/wrangler.jsonc, got '${host}'."
          exit 1
        fi
        if [ -z "${WEB_BUILD_CACHE_TOKEN:-}" ]; then
          echo '::error::WEB_BUILD_CACHE_TOKEN is not set; cannot verify the deployed revision.'
          exit 1
        fi
        origin="https://${host}"
        max_attempts=6
        attempt=1
        while :; do
          failures=()
          for route in /admin /admin/aliases /api/admin/bootstrap /api/admin/health; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "${origin}${route}") || code=000
            [ "$code" = 404 ] || failures+=("${route} answered ${code}, expected 404")
          done
          revision=$(curl -sS --fail --max-time 10 -H 'Cache-Control: no-cache' \
            "${origin}/build-info.json?smoke=${GITHUB_RUN_ID}-${attempt}" | jq -r '.dataRevision // empty') || revision=''
          [ "$revision" = "$WEB_BUILD_CACHE_TOKEN" ] \
            || failures+=("build-info.json dataRevision '${revision}' does not match built revision '${WEB_BUILD_CACHE_TOKEN}'")
          if [ "${#failures[@]}" -eq 0 ]; then
            break
          fi
          if [ "$attempt" -ge "$max_attempts" ]; then
            printf '::error::Smoke check failed: %s\n' "${failures[@]}"
            exit 1
          fi
          printf 'attempt %s: %s\n' "$attempt" "${failures[@]}"
          sleep $((attempt * 5))
          attempt=$((attempt + 1))
        done
        echo "冒烟检查通过：/admin 与 /api/admin/* 均为 404，build-info revision=${WEB_BUILD_CACHE_TOKEN}" >> "$GITHUB_STEP_SUMMARY"
