name: Setup
description: Install Node/pnpm, cache pnpm store, and install dependencies. Repo must already be checked out.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      name: Install pnpm
      # Version comes from packageManager in package.json
      # https://pnpm.io/continuous-integration#github-actions

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
