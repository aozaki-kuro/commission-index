name: Setup
description: Install Node/pnpm, cache pnpm store, and install dependencies. Repo must already be checked out.

outputs:
  install-duration:
    description: Duration of pnpm install in seconds
    value: ${{ steps.install.outputs.duration_seconds }}

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      name: Install pnpm
      # Version comes from packageManager in package.json
      # https://pnpm.io/continuous-integration#github-actions

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm

    - name: Cache pnpm store
      uses: actions/cache@v5
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    - name: Install dependencies
      id: install
      shell: bash
      run: |
        started_at=$(date +%s)
        pnpm install --frozen-lockfile
        ended_at=$(date +%s)
        echo "duration_seconds=$((ended_at - started_at))" >> "$GITHUB_OUTPUT"
